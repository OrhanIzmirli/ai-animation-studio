# Artist profile: cel animation photographed on film, version 2.
#
# Same hand as retro_cel_v1 (same seed, timing, ink weights, bloom, grain).
# Changed habits, from what v1 measured on the first clips:
#   - the palette reserves slots for small saturated accents of the start
#     frame;
#   - ink no longer darkens the picture (fills are compensated).
#
# A profile is immutable once videos were made with it. To change a habit,
# copy this file to retro_cel_v3.yaml. Parameters: docs/STYLE_LAYER.md.

name: retro_cel
version: 2
description: >-
  Cel-on-film finish: animator timing, softened palette from the start frame
  with reserved accent colours, steady moderate ink lines that do not darken
  the picture, slight bloom, film grain.
seed: 4207          # the same hand as v1

habits:
  timing:
    mode: animator
    still_below: 1.0
    moderate_below: 3.0
    hysteresis: 0.2
    lookahead: 3
    rhythm_break: [4, 7]
  palette:
    k: 32
    strength: 0.6
    accent_slots: 6
  ink:
    strength: 0.6
    thickness: [1.0, 2.0]
    threshold: 34
    shadow_bias: 0.4
    contrast_bias: 0.4
    taper: 0.4
    pressure_variation: 0.1
    boil_px: 0.0
    noise_scale: 128
    preserve_luminance: true
  bloom:
    threshold: 170
    radius: 16
    strength: 0.35
  grain:
    amount: 3.5
    shadow_gain: 0.6
