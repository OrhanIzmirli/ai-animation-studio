# Artist profile: cel animation photographed on film, version 3.
#
# retro_cel_v2 with one changed habit: only saturated pixels may take one of
# the reserved accent colours (accent_pixel_saturation). In v2 a pale neutral
# such as a white shoe could land on a pale accent colour and turn pink.
#
# A profile is immutable once videos were made with it. To change a habit,
# copy this file to retro_cel_v4.yaml. Parameters: docs/STYLE_LAYER.md.

name: retro_cel
version: 3
description: >-
  Cel-on-film finish: animator timing, softened palette from the start frame
  with reserved accent colours, steady moderate ink lines that do not darken
  the picture, slight bloom, film grain.
seed: 4207          # the same hand as v1 and v2

habits:
  timing:
    mode: animator
    still_below: 1.0
    moderate_below: 3.0
    hysteresis: 0.2
    lookahead: 3
    rhythm_break: [4, 7]
  palette:
    k: 32
    strength: 0.6
    accent_slots: 6
    accent_pixel_saturation: 0.3   # duller pixels never take an accent colour
  ink:
    strength: 0.6
    thickness: [1.0, 2.0]
    threshold: 34
    shadow_bias: 0.4
    contrast_bias: 0.4
    taper: 0.4
    pressure_variation: 0.1
    boil_px: 0.0
    noise_scale: 128
    preserve_luminance: true
  bloom:
    threshold: 170
    radius: 16
    strength: 0.35
  grain:
    amount: 3.5
    shadow_gain: 0.6
