# Artist profile: printed-comic finish, version 3.
#
# comic_finish_v2 with one changed habit: only saturated pixels may take one of
# the reserved accent colours (accent_pixel_saturation). In v2 a pale neutral
# such as a white shoe could land on a pale accent colour and turn pink.
#
# A profile is immutable once videos were made with it. To change a habit,
# copy this file to comic_finish_v4.yaml. Parameters: docs/STYLE_LAYER.md.

name: comic_finish
version: 3
description: >-
  Printed-comic finish: animator timing, limited palette from the start frame
  with reserved accent colours, content-aware ink lines with slight wobble,
  tone-preserving halftone shadows, paper grain, 1 px misregistration.
seed: 1701          # the same hand as v1 and v2

habits:
  timing:
    mode: animator
    still_below: 1.0
    moderate_below: 3.0
    hysteresis: 0.2
    lookahead: 3
    rhythm_break: [3, 6]
  palette:
    k: 24
    strength: 1.0
    accent_slots: 6         # of the 24 colours, kept for small saturated accents
    accent_pixel_saturation: 0.3   # duller pixels never take an accent colour
  ink:
    strength: 0.75
    thickness: [1.0, 3.5]
    threshold: 36
    shadow_bias: 0.6
    contrast_bias: 0.4
    taper: 0.6
    pressure_variation: 0.25
    boil_px: 0.6
    noise_scale: 96
    preserve_luminance: true
  halftone:
    dot_size: 6
    threshold: 55
    strength: 0.4
    variation: 0.15
    preserve_tone: true
  grain:
    amount: 2.5
    shadow_gain: 1.0
  misregistration:
    px: 1
