# MILO - 15-second teaser, third version: cut-out (cel) animation.
#
# milo_02's clips came from a video model that invented the motion; the owner
# judged the character animation insufficient. Here the video model is not
# used: painted plates (SDXL, no character) and Milo's approved drawing cut
# into parts (body, arms) are composited and animated by
# scripts/make_milo_teaser.py, like 1980s cel animation (12 drawings a
# second, held on twos). This file only records the plates and the cut;
# the timeline is in that script.

