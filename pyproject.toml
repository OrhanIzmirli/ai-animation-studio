[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-animation-studio"
version = "0.0.1"
description = "Experimental hobby project: benchmarking open video models and code-driven cut-out animation on a laptop GPU"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.12"
dependencies = ["pyyaml>=6", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow", "numpy"]
# Wan 2.2 TI2V-5B backend (docs/BACKEND_WAN_TI2V_5B.md). Needs a CUDA GPU;
# install the torch build matching your CUDA version first.
wan = [
    "torch",
    "diffusers>=0.36",  # 0.35.x cannot tile the Wan 2.2 VAE (ignores patch_size)
    "transformers",
    "accelerate",
    "ftfy",
    "pillow",
    "numpy",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
