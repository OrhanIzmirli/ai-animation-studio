[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-animation-studio"
version = "0.0.1"
description = "Self-correcting AI animation and video production pipeline (Phase 0: engineering and benchmarking foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
