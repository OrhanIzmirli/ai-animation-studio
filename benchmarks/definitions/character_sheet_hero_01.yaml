# Character sheet benchmark 01 - COMIC_HERO_01 turnaround.
# Full specification and rating criteria: docs/BENCHMARK_CHARACTER_SHEET_HERO_01.md
#
# Tests whether an image backend can turn the ONE canonical frame of the hero
# into a three-view character sheet without changing who he is or what he
# wears, drawn like the approved hand-made turnaround sheet. The sheet is the
# identity reference for the per-shot keyframes of the trailer.
#
# One run = one image: the whole sheet. Size and seed are chosen per run.
#
# DRAFT. Not runnable until a human sets "status: ready". Open points are
# listed under "notes" and in the specification.
#
# Canonical character reference for COMIC_HERO_01 (hand-made, approved
# 2026-10-05): ONE sheet image with THREE views (front, three-quarter, back).
# The views and the style target of this benchmark follow it.
#   benchmarks/references/comic_hero_01/character_turnaround_hero_01.jpg
#   1024x765 JPEG, sha256 7a7b391bc05a948e57b52b6173a03ef912f890875b0865c07e90dacf47d09c8a
# It is recorded under "notes"; it is not an input of this benchmark.
#
# Paths are relative to the project root.
# Original character. No existing character, title, logo, costume or
# signature motif of any franchise.

benchmark_id: character_sheet_hero_01
task_type: image_generation
status: draft

# The only INPUT is the canonical frame, as an identity REFERENCE (not a start
# frame, not an image to edit). One entry; the number of views is set under
# "composition", not here.
#   1672x941 PNG, sha256 3a3e76750196317ee5142d7d6d00d2c68af58a993ee54ca8cc9fa665dbf1e0fb
# Requires a backend that really uses at least one reference image.
reference_images:
  - benchmarks/references/comic_hero_01/rooftop_frame_v001.png

image_count: 1

prompt: >-
  Character sheet (turnaround) of the young man from the reference image,
  drawn as hand-made graphic novel concept art. One sheet with three
  full-body views of the same character standing in a neutral pose, arms
  relaxed at his sides, side by side at the same scale, feet on one common
  ground line: front view, three-quarter view turned to his left, back view.
  Plain light-grey background, no scenery. He is the same person in every
  view: a young man with short curly dark hair, wearing a black hooded jacket
  with the hood down and subtle dark-red accents, dark cargo trousers, white
  low-top sneakers with dark details, and a black backpack with dark-red
  straps. His face is uncovered and has a calm, neutral expression.
  Directional studio lighting with real highlights, core shadows and
  reflected light, identical in all three views. Hand-inked black ink
  contours with naturally varying line weight, thick outer contours and
  thinner interior details. Bold flat cel shading on the clothing, coarse
  halftone screen-tone dots in the mid-tones, rough hand-drawn hatching.
  Faint construction lines of the under-sketch show through in a few places.
  The face and torso are rendered more tightly, other areas stay looser and
  more gestural. Consistent face, hair, proportions and clothing in all three
  views.

negative_prompt: >-
  photorealistic, live action, 3D render look, glossy plastic shading, soft
  airbrushed gradients, smooth vector render, flat even lighting, uniform
  line weight, perfectly uniform halftone dot grid, uniformly polished
  finish, blurry, different person between views, changing hairstyle,
  changing clothing, changing proportions, missing view, extra view, cropped
  feet, cropped head, dynamic pose, scenery, city background, sunset
  lighting, extra limbs, deformed hands, extra fingers, text, letters,
  labels, logo, emblem, symbol on the clothing, watermark, signature, speech
  bubbles, mask, face covering, goggles, cape, armor, weapon, superhero
  costume

# --- what the sheet must contain (generic; backends use it as they can) ---

composition:
  layout: one image, three full-body views side by side, same scale, common ground line
  pose: standing, neutral, arms relaxed at the sides, hood down
  background: plain light grey, no scenery, no cast shadows on a wall
  views:            # all three are required, in this order, left to right
    - front
    - three_quarter          # his body turned to his left, facing the right side of the sheet
    - back
  # Dropped 2026-10-05 (were in the five-view plan, not on the approved
  # reference): three_quarter_right, profile.
  framing: every view shows the whole figure, head to shoes, nothing cropped

# Fixed design. The outfit is fixed by the canonical frame, which shows him
# from behind; the face is fixed by the approved turnaround sheet.
subject_details:
  identity: young man, slim build
  hair: short curly dark hair with volume on top, almost black
  jacket: black hooded jacket, hood down, loose fit; subtle dark-red accents as plain panels or seam lines
  backpack: black backpack worn on both shoulders, dark-red straps, small light buckles
  trousers: dark, loose cargo trousers with a side pocket
  shoes: white low-top sneakers with dark details and white laces
  accents: dark red only; no other accent colour
  face: uncovered; NOT visible in the canonical frame, it is the face of the approved turnaround sheet
  forbidden: no mask, no face covering, no logo, no emblem, no letter, no text, no costume, no cape

# Style target: the approved turnaround sheet. Wording follows turns 3 to 5 of
# docs/prompts/character_turnaround_hero_01.prompt.txt.
visual_direction:
  - graphic novel aesthetic, a human illustrator's concept art, the same hand as the approved turnaround sheet
  - hand-inked black ink contours with naturally varying, pressure-dependent line weight; thick outer contours, thinner interior details; ink pooling and nib texture may show
  - directional studio lighting with real highlights, core shadows and reflected light, identical in all views; not flat, not even
  - a touch of dark-red rim light on the edges of the hair and the jacket silhouette
  - bold flat cel shading blocks on the clothing
  - coarse halftone screen-tone dots in the mid-tones; not a perfectly uniform dot grid
  - rough hand-drawn hatch and cross-hatch details
  - faint construction and under-sketch lines visible in a few places, as if not fully erased
  - a deliberately varied level of finish, face and torso tighter, other areas looser and more gestural; not uniformly polished

notes: |
  character: COMIC_HERO_01
  reference_sha256: 3a3e76750196317ee5142d7d6d00d2c68af58a993ee54ca8cc9fa665dbf1e0fb
  evaluation: CharacterSheetEvaluation (manual, 1-10, higher is better)
  suggested size: a wide sheet, e.g. 1536x1024 or wider (chosen per run, recorded)
  canonical_character_reference: benchmarks/references/comic_hero_01/character_turnaround_hero_01.jpg
  canonical_character_reference_sha256: 7a7b391bc05a948e57b52b6173a03ef912f890875b0865c07e90dacf47d09c8a
  canonical_character_reference_views: front, three-quarter, back (one sheet image, hand-made, approved 2026-10-05)
  decided: one sheet image, not one image per view
  decided: the face is the one on the approved turnaround sheet
  decided (2026-10-05): three views (front, three_quarter, back); three_quarter_right and profile are dropped
  decided (2026-10-05): the style target is the approved turnaround sheet (directional light, visible under-sketch, varied finish), not flat even lighting and clean closed line work
  open (draft): the red marks on the jacket back in the canonical frame are read here as plain accents, not a symbol
